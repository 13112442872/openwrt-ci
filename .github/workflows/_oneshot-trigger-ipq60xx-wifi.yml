name: One-shot trigger IPQ60XX-6.12-WIFI

on:
  push:
    paths:
      - '.github/workflows/_oneshot-trigger-ipq60xx-wifi.yml'

permissions:
  contents: read
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch IPQ60XX-6.12-WIFI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run IPQ60XX-6.12-WIFI.yml --ref main
